# Integración continua — Sistema de Gestión de la Calidad
#
# Implementa las etapas de CLAUDE.md §5.4 que HOY pueden ejecutarse de verdad.
# Las que dependen de piezas que aún no existen están listadas al final de este
# archivo como pendientes explícitos, no como pasos vacíos: un pipeline que sale
# en verde saltándose las pruebas es peor que no tener pipeline.
#
#   §5.4-1  Lint + typecheck ............. implementado (job `calidad`)
#   §5.4-2  Pruebas unitarias ............ implementado (dominio de front y back)
#   §5.4-2b Pruebas de integración ...... implementado (adaptadores vs. Postgres efímero)
#   §5.4-3  SAST + auditoría de deps ..... implementado (job `seguridad`)
#   §5.4-4  Cobertura ≥80% en dominio .... implementado (umbral en vitest.config)
#   §5.4-5  Build ........................ parcial: estático del frontend + esquema
#   §5.4-6  Push a ghcr.io ............... PENDIENTE: no hay imágenes que publicar
#   §5.4-7  Deploy al VPS ................ PENDIENTE: no hay VPS aprovisionado
#   §5.4-8  Smoke tests en Staging ....... PENDIENTE: depende de §5.4-7

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela el anterior. CLAUDE.md §7.1 pide
# vigilar el consumo de minutos, y revisar commits ya superados no aporta nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: ningún job de este workflow escribe en el repositorio.
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  calidad:
    name: Calidad del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Lee .nvmrc en lugar de fijar la versión aquí: una sola fuente de
          # verdad entre las máquinas del equipo y CI (CLAUDE.md §4.6).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` y no `npm install`: falla si el lockfile no coincide con
      # package.json, que es justamente lo que pide CLAUDE.md §4.6.
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # CLAUDE.md §5.4-2 y §5.4-4. El umbral del 80% en `domain/` vive en
      # vitest.config.ts, así que el mismo comando falla igual en local.
      - name: Pruebas y cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

  seguridad:
    name: Quality gates de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # CLAUDE.md §5.4-3: bloquea ante hallazgos críticos o altos.
      # Los moderados y bajos se reportan pero no detienen el merge.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Informe completo de vulnerabilidades
        if: always()
        run: npm audit || true

  sast:
    name: Análisis estático de seguridad
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    # El contenedor trae su propio working-directory; el `defaults` de arriba
    # apunta a apps/web, que aquí no aplica porque se analiza todo el repo.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      # `semgrep scan` funciona sin cuenta ni token, a diferencia de `semgrep ci`.
      # Reglas OWASP según CLAUDE.md §4.7; falla solo en severidad ERROR, que es
      # lo que el estándar considera crítico/alto.
      - name: Semgrep
        run: >
          semgrep scan
          --config=p/typescript
          --config=p/react
          --config=p/owasp-top-ten
          --severity=ERROR
          --error
          --metrics=off
  esquema:
    name: "Backend: dominio y esquema"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Postgres efímero, como pide CLAUDE.md §6.4 para las pruebas que tocan
    # base de datos: nunca contra staging ni producción. Se destruye con el job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sgc
          POSTGRES_PASSWORD: sgc
          POSTGRES_DB: sgc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sgc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sgc:sgc@localhost:5432/sgc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Antes del typecheck: `prisma/seed.ts` importa el cliente generado y sin
      # él no compila. El cliente no se versiona (se regenera), así que en un
      # checkout limpio no existe.
      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # §4.2 los marca como no negociables. El backend se quedó sin ellos
      # mientras el frontend sí los tenía; el lint con tipos necesita el cliente
      # de Prisma ya generado, de ahí que vaya después del paso anterior.
      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # El dominio y los casos de uso son puros: no necesitan la base de datos
      # para probarse, y por eso corren antes de levantarla.
      - name: Pruebas de dominio y aplicación
        run: npm run test:coverage

      - name: Validar esquema
        run: npx prisma validate

      # Aplica la migración de verdad. Es lo único que detecta el SQL escrito a
      # mano que Prisma no valida: los índices parciales, los CHECK y los
      # triggers de inmutabilidad.
      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      # Si el esquema se editó sin generar la migración correspondiente, el
      # diff sale no vacío y `--exit-code` devuelve 2.
      #
      # `--from-config-datasource` lee la conexión de prisma.config.ts. En
      # Prisma 7 ya no existe `--from-url`.
      #
      # El SQL escrito a mano (índices parciales, CHECK, triggers) no aparece
      # como diferencia: Prisma ignora lo que su datamodel no puede representar.
      # Verificado en local en ambos sentidos, con el esquema al día y con una
      # tabla añadida sin migrar.
      - name: Migraciones al día con el esquema
        run: |
          npx prisma migrate diff             --from-config-datasource             --to-schema prisma/schema.prisma             --exit-code


      # El seed carga el catálogo de roles y permisos. Que corra aquí garantiza
      # que sigue siendo idempotente y que no referencia permisos inexistentes.
      - name: Sembrar roles y permisos
        run: npx tsx prisma/seed.ts

      - name: Verificar que el seed es idempotente
        run: npx tsx prisma/seed.ts

      # §6.4, nivel de integración: los adaptadores contra el Postgres real de
      # este job. Es lo único que detecta que la expresión de unicidad de la
      # aplicación y la del índice hayan dejado de coincidir —ya ocurrió una vez,
      # por una barra invertida— y que la reordenación de la malla no deje
      # huecos. Van aparte de las unitarias para que `npm test` siga corriendo
      # sin base de datos.
      - name: Pruebas de integración
        run: npm run test:integration

# ── Etapas pendientes ────────────────────────────────────────────────────────
#
# No están escritas como pasos comentados porque envejecerían mal. Lo que hace
# falta antes de poder añadirlas:
#
# §6.4 — Pruebas de API/contrato y E2E
#   La integración de los adaptadores contra Postgres ya corre. Falta el nivel
#   de API/contrato con Supertest, que exige arrancar la aplicación de NestJS
#   dentro del runner de pruebas: Vitest transpila con esbuild y esbuild no
#   emite metadatos de decoradores, así que el contenedor de inyección arranca
#   vacío. Se resuelve con `unplugin-swc`, y es el mismo motivo por el que
#   `start:dev` no funciona hoy. Los flujos E2E de Playwright dependen además
#   de que el frontend consuma la API real, no la capa simulada.
#
#   Falta también Redis efímero, que hoy no hace falta porque no hay colas.
#
# §5.4-5 y §5.4-6 — Imágenes Docker y ghcr.io
#   Requiere apps/api con su Dockerfile. El frontend no lleva imagen propia:
#   CLAUDE.md §5.2 lo compila a estáticos servidos por Caddy.
#
# §5.4-7 y §5.4-8 — Deploy y smoke tests
#   Requiere el VPS aprovisionado y estos secretos en el repositorio:
#   SSH_HOST, SSH_USER, SSH_KEY. El deploy debe correr `prisma migrate deploy`
#   como paso explícito antes de levantar `api`, nunca al arrancar el contenedor.
